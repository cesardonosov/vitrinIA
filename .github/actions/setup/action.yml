name: setup
description: Node (from .nvmrc), pnpm (from packageManager) and a frozen-lockfile install.
runs:
  using: composite
  steps:
    # No `version:` input: pnpm/action-setup reads packageManager from package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies (frozen lockfile, install scripts blocked by onlyBuiltDependencies)
      shell: bash
      env:
        LEFTHOOK: "0"
      run: pnpm install --frozen-lockfile
